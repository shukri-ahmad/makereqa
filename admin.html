<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - MakeReqa Build & Match</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --mrq-dark: #0B132B;
            --mrq-panel: #1C2541;
            --mrq-gold: #FFB300;
            --mrq-red: #E71D24;
            --mrq-blue: #2196F3;
            --mrq-green: #4CAF50;
            --text-main: #FFFFFF;
        }

        body { font-family: 'Rajdhani', sans-serif; background-color: var(--mrq-dark); color: var(--text-main); padding: 20px; display: none; }
        .container { max-width: 800px; margin: 0 auto; background: var(--mrq-panel); padding: 20px 30px; border-radius: 12px; border-top: 5px solid var(--mrq-gold); border-bottom: 5px solid var(--mrq-blue); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .header-panel { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;}
        .header-panel img { max-width: 200px; }
        
        .header-controls { display: flex; align-items: center; gap: 20px;}
        .header-controls a { color: var(--mrq-gold); text-decoration: none; font-weight: bold; font-family: 'Orbitron', sans-serif; font-size: 12px; }
        .header-controls a:hover { color: #FFF; }
        
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; color: var(--mrq-gold); text-transform: uppercase; letter-spacing: 1px;}
        
        .tab-menu { display: flex; border-bottom: 2px solid rgba(255,255,255,0.1); margin-bottom: 25px; }
        .tab-btn { flex: 1; padding: 12px; cursor: pointer; background: rgba(0,0,0,0.2); border: none; font-size: 15px; font-weight: bold; color: #8b949e; font-family: 'Orbitron', sans-serif; transition: 0.3s; }
        .tab-btn.active { background: var(--mrq-blue); color: white; border-top: 2px solid var(--mrq-gold); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        input[type="text"], select { padding: 10px; width: 65%; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; background: #0B132B; color: white; font-family: 'Rajdhani', sans-serif; font-size: 16px;}
        select { width: 30%; margin-left: 10px; font-weight: bold; color: var(--mrq-gold); }
        
        button { padding: 10px 15px; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: 'Orbitron', sans-serif; text-transform: uppercase; transition: 0.2s;}
        button.btn-primary { background: var(--mrq-blue); }
        button.btn-primary:hover { background: #1976D2; }
        button.btn-gold { background: var(--mrq-gold); color: black; width: 100%; margin-top: 15px; font-size: 16px; }
        button.btn-red { background-color: var(--mrq-red); padding: 5px 10px; font-size: 12px; }
        button.btn-green { background-color: var(--mrq-green); color: white; padding: 8px 15px; font-size: 16px; width: 100%; box-shadow: 0 4px 10px rgba(76, 175, 80, 0.4);}
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 18px;}
        td, th { padding: 12px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        th { background: #0B132B; color: var(--mrq-gold); font-family: 'Orbitron', sans-serif; font-size: 14px;}
        .team-name { font-weight: bold; text-align: left; padding-left: 15px; color: white;}
        
        .timer-container { text-align: center; background: #0B132B; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 2px solid var(--mrq-gold); }
        .timer-display { font-size: 70px; font-family: 'Orbitron', sans-serif; color: var(--mrq-gold); font-weight: 900; line-height: 1;}
        .timer-display.running { color: var(--mrq-green); text-shadow: 0 0 15px rgba(76, 175, 80, 0.5); }
        .timer-display.stopped { color: var(--mrq-red); }
        
        .status-badge { padding: 5px 10px; border-radius: 4px; font-size: 14px; font-weight: bold; font-family: 'Orbitron', sans-serif;}
        .status-idle { background: #555; color: white; }
        .status-playing { background: var(--mrq-blue); color: white; animation: pulse 1.5s infinite; }
        .status-done { background: var(--mrq-green); color: white; }
        .status-dnf { background: var(--mrq-red); color: white; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body id="adminBody">

<div class="container">
    <div class="header-panel">
        <img src="image_5e2713.png" alt="MakeReqa Logo">
        <div class="header-controls">
            <a href="index.html" target="_blank">[ LAUNCH PUBLIC VIEWER ]</a>
            <button class="btn-red" onclick="logout()">LOGOUT</button>
        </div>
    </div>
    
    <div class="tab-menu">
        <button id="tabBtn0" class="tab-btn active" onclick="switchTab('gamesTab', this)">SYSTEMS</button>
        <button id="tabBtn1" class="tab-btn" onclick="switchTab('teamsTab', this)">TEAMS</button>
        <button id="tabBtn2" class="tab-btn" onclick="switchTab('roundsTab', this)">MATCH ROUND</button>
    </div>

    <div id="gamesTab" class="tab-content active">
        <h3>INITIALIZE NEW EVENT</h3>
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <input type="text" id="gameName" placeholder="e.g., Makereqa Finals" style="width: 60%;">
            <select id="gameDuration" style="width: 40%;">
                <option value="1">1 MINUTE BUILD</option>
                <option value="3">3 MINUTE BUILD</option>
                <option value="5" selected>5 MINUTE BUILD</option>
                <option value="10">10 MINUTE BUILD</option>
            </select>
        </div>
        <button class="btn-primary" onclick="createGame()">CREATE EVENT</button>

        <h3 style="margin-top: 40px;">YOUR EVENTS</h3>
        <table>
            <thead><tr><th>EVENT NAME</th><th>ACTION</th></tr></thead>
            <tbody id="games-list-body"></tbody>
        </table>
    </div>

    <div id="teamsTab" class="tab-content">
        <h3 id="targetGameLabel" style="color: var(--mrq-blue);">TARGET EVENT: NONE</h3>
        <div id="teamSetupControls">
            <h3>REGISTER PARTICIPANT/TEAM</h3>
            <input type="text" id="teamName" placeholder="Enter Team Name">
            <button class="btn-primary" onclick="addTeam()">REGISTER</button>
        </div>
        <h3 style="margin-top: 30px;">ROSTER (<span id="teamCount">0</span>)</h3>
        <table>
            <thead><tr><th>TEAM NAME</th><th>TOTAL PTS</th><th>TOTAL TIME</th><th>ACTION</th></tr></thead>
            <tbody id="teams-list-body"></tbody>
        </table>
    </div>

    <div id="roundsTab" class="tab-content">
        <div id="masterTimerUI" class="timer-container">
            <div style="color: white; font-size: 16px; font-weight: bold; letter-spacing: 2px; margin-bottom: 5px;">ROUND <span id="roundCounterDisplay">1</span> TIMER</div>
            <div id="timeClock" class="timer-display">00:00.0</div>
            <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: center;" id="timerControlsBox">
                <button class="btn-green" onclick="startRound()">START BUILD ROUND</button>
            </div>
        </div>

        <h3>LIVE BUILD STATUS</h3>
        <table>
            <thead><tr><th>TEAM</th><th>STATUS / TIME</th><th>ACTION</th></tr></thead>
            <tbody id="live-round-body"></tbody>
        </table>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const SUPER_ADMIN_UID = "PmZflg1ZBxSR0ZXTrvjma2RMwYB2"; 

  const firebaseConfig = {
    apiKey: "AIzaSyCcX-3R3eMR5wu1igI6fz3XiqeldiN4n68",
    authDomain: "makereqa.firebaseapp.com",
    projectId: "makereqa",
    storageBucket: "makereqa.firebasestorage.app",
    messagingSenderId: "810656848426",
    appId: "1:810656848426:web:746129db0318383236c153"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const POINTS_SYSTEM = [10, 8, 6, 4, 3, 2, 1]; 

  let currentGameId = null;
  let currentTeamsList = [];
  let allGamesData = {}; 
  let localTimerInterval = null;
  let audioCtx = null;
  
  let unsubGames = null;
  let unsubTeams = null;

  function getAudioCtx() {
      if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
      return audioCtx;
  }
  function playSound(type) {
      const ctx = getAudioCtx();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      if (type === 'start') {
          osc.type = 'square'; osc.frequency.setValueAtTime(600, ctx.currentTime);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          osc.start(); osc.stop(ctx.currentTime + 0.8);
      } else if (type === 'done') {
          osc.type = 'sine'; osc.frequency.setValueAtTime(1200, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1800, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          osc.start(); osc.stop(ctx.currentTime + 0.2);
      } else if (type === 'end') {
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, ctx.currentTime);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          osc.start(); osc.stop(ctx.currentTime + 1.5);
      }
  }

  function formatTime(ms) {
      if (ms < 0) ms = 0;
      let totalSeconds = Math.floor(ms / 1000);
      let m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
      let s = (totalSeconds % 60).toString().padStart(2, '0');
      let dec = Math.floor((ms % 1000) / 100);
      return `${m}:${s}.${dec}`;
  }

  onAuthStateChanged(auth, user => {
    if (user) {
        document.getElementById("adminBody").style.display = "block";
        loadUserGames(user); 
    } else {
        window.location.href = "login.html"; 
    }
  });

  window.logout = () => signOut(auth).then(() => window.location.href = "login.html");

  function loadUserGames(user) {
      let qGames = (user.uid === SUPER_ADMIN_UID) 
          ? query(collection(db, "mrq_games")) 
          : query(collection(db, "mrq_games"), where("createdBy", "==", user.uid)); 
      
      unsubGames = onSnapshot(qGames, (snapshot) => {
          const tbody = document.getElementById("games-list-body");
          tbody.innerHTML = "";
          allGamesData = {};

          snapshot.forEach(docSnap => {
              const game = docSnap.data();
              allGamesData[docSnap.id] = game;
              tbody.innerHTML += `
                  <tr>
                      <td style="font-weight: bold; text-align: left; padding-left: 15px;">${game.name}</td>
                      <td>
                          <button class="btn-primary" style="padding: 5px 10px; font-size:12px;" onclick="selectGame('${docSnap.id}')">SELECT</button>
                          <button class="btn-red" onclick="deleteGame('${docSnap.id}', '${game.name}')">DEL</button>
                      </td>
                  </tr>
              `;
          });

          if(currentGameId && allGamesData[currentGameId]) {
              renderTimerAndRoundUI(allGamesData[currentGameId]); 
          }
      });
  }

  window.switchTab = function(tabId, btnElement) {
    if ((tabId === 'teamsTab' || tabId === 'roundsTab') && !currentGameId) {
        return alert("Please SELECT an event first.");
    }
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btnElement.classList.add('active');
  };

  window.createGame = async function() {
      const name = document.getElementById("gameName").value.trim();
      const durationMins = parseInt(document.getElementById("gameDuration").value);
      if(!name) return;
      
      await addDoc(collection(db, "mrq_games"), { 
          name: name, 
          createdBy: auth.currentUser.uid,
          timerDurationMs: durationMins * 60 * 1000,
          roundState: 'idle', 
          roundStartTime: 0,
          currentRound: 1
      });
      document.getElementById("gameName").value = "";
  };

  window.deleteGame = async function(id, name) {
      if(confirm(`Delete entire event: "${name}"?`)) {
          if(currentGameId === id) currentGameId = null;
          await deleteDoc(doc(db, "mrq_games", id));
      }
  };

  window.selectGame = function(id) {
      currentGameId = id;
      const game = allGamesData[id];
      document.getElementById("targetGameLabel").innerText = `TARGET EVENT: ${game.name}`;
      
      if(unsubTeams) unsubTeams();
      
      unsubTeams = onSnapshot(collection(db, "mrq_games", currentGameId, "mrq_teams"), (snapshot) => {
          currentTeamsList = [];
          snapshot.forEach(d => currentTeamsList.push({ id: d.id, ...d.data() }));
          renderTeamsList();
          renderTimerAndRoundUI(allGamesData[currentGameId]);
      });

      switchTab('teamsTab', document.getElementById('tabBtn1'));
  };

  function renderTeamsList() {
      document.getElementById("teamCount").innerText = currentTeamsList.length;
      const tbody = document.getElementById("teams-list-body");
      let htmlString = "";
      
      let sortedRoster = [...currentTeamsList].sort((a,b) => {
          if (b.totalPoints !== a.totalPoints) return b.totalPoints - a.totalPoints;
          return a.totalTimeMs - b.totalTimeMs;
      });

      sortedRoster.forEach(team => {
          htmlString += `<tr>
              <td style="text-align: left; padding-left: 15px; font-weight: bold;">${team.name}</td>
              <td style="color: var(--mrq-gold); font-weight:bold;">${team.totalPoints}</td>
              <td>${formatTime(team.totalTimeMs)}</td>
              <td><button class="btn-red" onclick="deleteTeam('${team.id}', '${team.name}')">DEL</button></td>
          </tr>`;
      });
      tbody.innerHTML = htmlString;
  }

  window.addTeam = async function() {
      const name = document.getElementById("teamName").value.trim();
      if(!name || !currentGameId) return;
      await addDoc(collection(db, "mrq_games", currentGameId, "mrq_teams"), { 
          name: name, 
          totalPoints: 0, 
          totalTimeMs: 0,
          currentRoundStatus: 'idle', 
          currentRoundTimeMs: 0
      });
      document.getElementById("teamName").value = ""; 
  };

  document.getElementById("teamName").addEventListener("keypress", function(e) {
      if (e.key === "Enter") { e.preventDefault(); window.addTeam(); }
  });

  window.deleteTeam = async function(id, name) {
      if(confirm(`Delete Team: ${name}?`)) await deleteDoc(doc(db, "mrq_games", currentGameId, "mrq_teams", id));
  };


  function renderTimerAndRoundUI(game) {
      if(!game) return;
      const display = document.getElementById("timeClock");
      document.getElementById("roundCounterDisplay").innerText = game.currentRound;
      
      const controlsBox = document.getElementById("timerControlsBox");
      const tbody = document.getElementById("live-round-body");

      let htmlString = "";
      currentTeamsList.forEach(team => {
          let statusHtml = "";
          let actionHtml = "";

          if (game.roundState === 'idle') {
              statusHtml = `<span class="status-badge status-idle">WAITING</span>`;
              actionHtml = `<span style="color:#555;">-</span>`;
          } 
          else if (game.roundState === 'running') {
              if (team.currentRoundStatus === 'done') {
                  statusHtml = `<span class="status-badge status-done">${formatTime(team.currentRoundTimeMs)}</span>`;
                  actionHtml = `<span style="color:var(--mrq-green); font-weight:bold;">FINISHED</span>`;
              } else {
                  statusHtml = `<span class="status-badge status-playing">BUILDING...</span>`;
                  actionHtml = `<button class="btn-primary" style="padding: 10px 20px; font-size:16px; background:var(--mrq-gold); color:black;" onclick="markTeamDone('${team.id}')">DONE!</button>`;
              }
          } 
          else if (game.roundState === 'ended') {
              if (team.currentRoundStatus === 'done') {
                  statusHtml = `<span class="status-badge status-done">${formatTime(team.currentRoundTimeMs)}</span>`;
              } else {
                  statusHtml = `<span class="status-badge status-dnf">TIME UP (DNF)</span>`;
              }
              actionHtml = `<span style="color:#555;">ROUND OVER</span>`;
          }

          htmlString += `<tr>
              <td class="team-name">${team.name}</td>
              <td>${statusHtml}</td>
              <td>${actionHtml}</td>
          </tr>`;
      });
      tbody.innerHTML = htmlString;

      clearInterval(localTimerInterval);
      if (game.roundState === 'idle') {
          display.innerText = formatTime(game.timerDurationMs);
          display.className = 'timer-display';
          controlsBox.innerHTML = `<button class="btn-green" onclick="startRound()">START BUILD ROUND</button>`;
      } 
      else if (game.roundState === 'running') {
          display.className = 'timer-display running';
          controlsBox.innerHTML = `<button class="btn-red" onclick="forceEndRound()">STOP ROUND (TIME UP)</button>`;
          
          localTimerInterval = setInterval(() => {
              let elapsed = Date.now() - game.roundStartTime;
              let remaining = game.timerDurationMs - elapsed;
              
              if (remaining <= 0) {
                  clearInterval(localTimerInterval);
                  display.innerText = "00:00.0";
                  display.className = 'timer-display stopped';
                  forceEndRound(true); 
              } else {
                  display.innerText = formatTime(remaining);
              }
          }, 50);
      }
      else if (game.roundState === 'ended') {
          display.innerText = "00:00.0";
          display.className = 'timer-display stopped';
          controlsBox.innerHTML = `
              <button class="btn-gold" style="width:auto; margin-top:0;" onclick="calculatePointsAndNext()">CALCULATE POINTS & PREPARE NEXT ROUND</button>
          `;
      }
  }

  window.startRound = async function() {
      if(currentTeamsList.length === 0) return alert("Add teams first.");
      playSound('start');
      
      const teamPromises = currentTeamsList.map(t => 
          updateDoc(doc(db, "mrq_games", currentGameId, "mrq_teams", t.id), { 
              currentRoundStatus: 'playing', 
              currentRoundTimeMs: 0 
          })
      );
      await Promise.all(teamPromises);

      await updateDoc(doc(db, "mrq_games", currentGameId), { 
          roundState: 'running', 
          roundStartTime: Date.now() 
      });
  };

  window.markTeamDone = async function(teamId) {
      const game = allGamesData[currentGameId];
      if(game.roundState !== 'running') return;
      
      playSound('done');
      const elapsed = Date.now() - game.roundStartTime;
      
      await updateDoc(doc(db, "mrq_games", currentGameId, "mrq_teams", teamId), { 
          currentRoundStatus: 'done', 
          currentRoundTimeMs: elapsed 
      });
  };

  window.forceEndRound = async function(auto = false) {
      if(!auto && !confirm("Stop the round right now?")) return;
      playSound('end');
      await updateDoc(doc(db, "mrq_games", currentGameId), { roundState: 'ended' });
  };

  window.calculatePointsAndNext = async function() {
      if(!confirm("This will calculate points based on time, assign them to the leaderboard, and setup the next round. Proceed?")) return;
      
      const game = allGamesData[currentGameId];
      
      let roundResults = currentTeamsList.map(t => {
          let time = (t.currentRoundStatus === 'done') ? t.currentRoundTimeMs : game.timerDurationMs;
          return { ...t, evaluatedTime: time };
      });
      
      roundResults.sort((a, b) => a.evaluatedTime - b.evaluatedTime);

      const teamPromises = roundResults.map((teamData, index) => {
          let pointsEarned = index < POINTS_SYSTEM.length ? POINTS_SYSTEM[index] : 0;
          
          return updateDoc(doc(db, "mrq_games", currentGameId, "mrq_teams", teamData.id), { 
              totalPoints: teamData.totalPoints + pointsEarned,
              totalTimeMs: teamData.totalTimeMs + teamData.evaluatedTime,
              currentRoundStatus: 'idle',
              currentRoundTimeMs: 0
          });
      });
      await Promise.all(teamPromises);

      await updateDoc(doc(db, "mrq_games", currentGameId), { 
          roundState: 'idle',
          currentRound: game.currentRound + 1
      });
      
      alert("Points calculated! Leaderboard updated.");
  };

</script>
</body>
</html>
